name: Auto Update NAV

on:
  schedule:
    # 1. Dime: 05:00 น. เวลาไทย (เช้า อ.-ส.) -> UTC คือ 22:00 น. (คืน จ.-ศ.)
    - cron: '0 22 * * 1-5'
    
    # 2. GPF: 10:00 น. เวลาไทย (จ.-ศ.) -> UTC คือ 03:00 น. (จ.-ศ.)
    - cron: '0 3 * * 1-5'
    
    # 3. MFC: 19:30 น. เวลาไทย (จ.-ศ.) -> UTC คือ 12:30 น. (จ.-ศ.)
    - cron: '30 12 * * 1-5'
    
    # 4. SCB: 20:30 น. เวลาไทย (จ.-ศ.) -> UTC คือ 13:30 น. (จ.-ศ.)
    - cron: '30 13 * * 1-5'

  workflow_dispatch:

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase requests beautifulsoup4 yfinance

      - name: Run NAV Update Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_nav.py

name: Auto Update Portfolio NAV

on:
  workflow_dispatch: # เปิดรับการสั่งรันจาก cron-job.org หรือกดรันด้วยตนเอง

jobs:
  update-nav:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas supabase yfinance playwright beautifulsoup4 pythainav tenacity
          playwright install --with-deps chromium

      # 1. Dime US Stock
      - name: Run Dime US Stock Price Fetch
        run: python fetch_dime_nav.py

      # 2. GPF
      - name: Run GPF NAV Fetch
        run: python fetch_gpf_nav.py

      # 3. MFC & SCB
      - name: Run MFC NAV Fetch
        run: python fetch_mfc_nav.py

      - name: Run SCB NAV Fetch
        run: python fetch_scb_nav.py

      # 4. Daily Snapshot
      - name: Save Daily Snapshot
        run: python daily_snapshot.py

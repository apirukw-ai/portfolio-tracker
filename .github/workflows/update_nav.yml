name: Auto Update NAV & Stock Prices

on:
  schedule:
    - cron: '0 13 * * 1-5' # รันทุกวันจันทร์-ศุกร์ เวลา 20:00 น. ไทย
  workflow_dispatch: # ปุ่มกดสั่งรันเอง

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase yfinance beautifulsoup4

      - name: Run NAV Update Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python update_nav.py

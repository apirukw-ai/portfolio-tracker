name: Auto Update Portfolio NAV

on:
  schedule:
    # 1. Dime: ~05:07 น. เวลาไทย (เช้า อ.-ส.) -> UTC 22:07 น.
    - cron: '7 22 * * 1-5'

    # 2. GPF: ~10:13 น. เวลาไทย (จ.-ศ.) -> UTC 03:13 น.
    - cron: '13 3 * * 1-5'

    # 3. MFC: ~19:34 น. เวลาไทย (จ.-ศ.) -> UTC 12:34 น.
    - cron: '34 12 * * 1-5'

    # 4. SCB + Snapshot ยอดรวม: ~20:42 น. เวลาไทย (จ.-ศ.) -> UTC 13:42 น.
    - cron: '42 13 * * 1-5'

  workflow_dispatch:

jobs:
  update-nav:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase requests beautifulsoup4 yfinance playwright pythainav
          playwright install --with-deps chromium

      - name: Run Dime US Stock Price Fetch
        if: github.event.schedule == '7 22 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python fetch_dime_nav.py

      - name: Run GPF NAV Fetch
        if: github.event.schedule == '13 3 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python fetch_gpf_nav.py

      - name: Run MFC NAV Fetch
        if: github.event.schedule == '34 12 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python fetch_mfc_nav.py

      - name: Run SCB NAV Fetch
        if: github.event.schedule == '42 13 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python fetch_scb_nav.py

      - name: Save Daily Snapshot
        if: github.event.schedule == '42 13 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python daily_snapshot.py

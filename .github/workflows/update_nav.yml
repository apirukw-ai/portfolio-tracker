name: Auto Update NAV & Stock Prices

on:
  schedule:
    # รันอัตโนมัติทุกวันจันทร์-ศุกร์ เวลา 13:00 UTC (20:00 น. เวลาไทย)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # อนุญาตให้กดปุ่มสั่ง Run Manual ได้จากหน้า GitHub

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Run NAV Update Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python update_nav.py
